<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Norse Archaeology — Geography Quiz</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f1eb;--surface:#fff;--border:#ccc8be;--text:#18160f;--muted:#6b6358;
  --city:#b83224;--river:#1a5f82;--region:#5a4070;--sea:#9a6800;
  --correct:#2a6048;--wrong:#8a3020;
  --fh:'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
  --fb:Georgia,'Times New Roman',serif;
  --fu:system-ui,-apple-system,sans-serif;
}

/* iframe-safe layout: no height:100% on html/body */
body{font-family:var(--fb);background:var(--bg);color:var(--text);margin:0;padding:0}

header{padding:9px 14px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-family:var(--fh);font-size:16px;font-weight:normal;letter-spacing:.02em}
.hdr-sub{font-size:11px;color:var(--muted);font-family:var(--fu)}
.legend{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.leg{display:flex;align-items:center;gap:4px;font-family:var(--fu);font-size:11px;color:var(--muted)}
.leg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.leg-portage{width:18px;height:0;border-top:2.5px dashed #b03060;flex-shrink:0}

/* Main body: side-by-side, fixed viewport height minus header */
.main{display:flex;width:100%;}
#map{height:580px;width:calc(100% - 330px);float:left;background:#e8e4dc;}
.right-col{width:330px;float:right;height:580px;display:flex;flex-direction:column;border-left:1px solid var(--border);background:var(--surface);overflow:hidden;}

/* Map fills left side */


/* Quiz section — fixed, no scroll */
.quiz-panel{padding:12px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.score-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.score-big{font-family:var(--fh);font-size:19px}
.score-lbl{font-family:var(--fu);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.prog-track{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:9px}
.prog-fill{height:100%;background:var(--correct);border-radius:2px;transition:width .4s;width:0}
.q-lbl{font-family:var(--fu);font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:3px}
.q-badge{display:inline-block;font-family:var(--fu);font-size:10px;padding:1px 6px;border-radius:8px;margin-left:5px;font-weight:500}
.bc{background:#fdecea;color:var(--city)}
.br{background:#e5f0f6;color:var(--river)}
.bg2{background:#edeaf4;color:var(--region)}
.bs{background:#fdf4e2;color:var(--sea)}
.q-text{font-family:var(--fh);font-size:13px;line-height:1.45;min-height:34px;margin-bottom:9px}
.q-idle{font-style:italic;color:var(--muted);font-size:12px;font-family:var(--fu)}
.ans-row{display:flex;gap:5px;margin-bottom:5px}
#ans{flex:1;padding:6px 8px;font-family:var(--fb);font-size:13px;border:1px solid var(--border);border-radius:3px;background:var(--bg);color:var(--text);outline:none}
#ans:focus{border-color:#777}
#chk{padding:6px 11px;font-family:var(--fu);font-size:12px;border:1px solid var(--border);border-radius:3px;background:var(--text);color:var(--surface);cursor:pointer;white-space:nowrap}
#chk:disabled{opacity:.3;cursor:default}
#fb{font-family:var(--fu);font-size:11.5px;min-height:15px;margin-bottom:4px;line-height:1.35}
.fbc{color:var(--correct)}.fbw{color:var(--wrong)}
#hint-btn{font-family:var(--fu);font-size:11px;color:var(--muted);background:none;border:none;cursor:pointer;text-decoration:underline;padding:0;text-align:left;max-width:100%;line-height:1.4}

/* Reference key — scrollable, fills remaining height */
.key-panel{flex:1;overflow-y:auto;min-height:0}
.key-header{
  padding:6px 14px;background:var(--bg);border-bottom:1px solid var(--border);
  font-family:var(--fu);font-size:10px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--muted);position:sticky;top:0;z-index:5
}
.key-body{padding:6px 14px 14px}
.key-section{margin-bottom:8px}
.key-sec-hdr{
  display:flex;align-items:center;gap:6px;margin-bottom:4px;padding-top:4px;
  font-family:var(--fu);font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;
  color:var(--muted);border-top:1px solid var(--border)
}
.key-section:first-child .key-sec-hdr{border-top:none;padding-top:0}
.key-sec-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.key-row{
  display:flex;align-items:center;gap:5px;padding:2px 3px;
  cursor:pointer;border-radius:3px;transition:background .1s
}
.key-row:hover{background:var(--bg)}
.key-num{
  width:8px;height:8px;border-radius:50%;
  flex-shrink:0;margin:0 2px
}
.key-name{font-family:var(--fb);font-size:11.5px;color:var(--text);flex:1;line-height:1.4}
.key-tick{font-size:11px;flex-shrink:0;width:12px;text-align:center}
.key-row.aok .key-name{color:var(--correct)}
.key-row.aok .key-tick{color:var(--correct)}
.key-row.awk .key-name{color:var(--wrong);text-decoration:line-through}
.key-row.awk .key-tick{color:var(--wrong)}

/* Result overlay */
#result{
  display:none;position:fixed;inset:0;background:rgba(244,241,235,.95);
  z-index:2000;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:2rem
}
#result.show{display:flex}
#result h2{font-family:var(--fh);font-size:24px;font-weight:normal;margin-bottom:6px}
.res-score{font-family:var(--fh);font-size:46px;color:var(--correct);margin:10px 0;line-height:1}
.res-msg{font-family:var(--fu);font-size:13px;color:var(--muted);max-width:320px;line-height:1.6;margin-bottom:18px}
#restart{padding:9px 24px;font-family:var(--fu);font-size:13px;border:1px solid var(--border);border-radius:3px;background:var(--text);color:var(--surface);cursor:pointer}

/* Leaflet marker */
.qm{
  width:22px;height:22px;border-radius:50%;
  border:2px solid rgba(255,255,255,.85);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--fu);font-size:9px;font-weight:700;color:#fff;
  cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.35);transition:transform .1s
}
.qm:hover{transform:scale(1.18)}
.qm.sel{transform:scale(1.2);outline:2px solid #18160f;outline-offset:1px}
</style>
</head>

<header>

    <div class="leg"><span class="leg-dot" style="background:var(--region)"></span>Regions</div>

<div class="main">

      </div>

</div>

<div id="result">

  <button id="restart">Restart</button>
</div>

}

/* ================================================================
   MARKERS
   ================================================================ */
function makeIcon(loc){
  const done=S.answered[loc.id]!==undefined;
  const ok=S.answered[loc.id]===true;
  let bg=TC[loc.type];
  if(done) bg=ok?'#2a6048':'#8a3020';
  const sel=!done&&S.cur===loc.id;
  return L.divIcon({
    className:'',
    html:`<div class="qm${sel?' sel':''}" style="background:${bg}">${loc.id}</div>`,
    iconSize:[22,22],iconAnchor:[11,11]
  });
}
ALL.forEach(loc=>{
  const m=L.marker([loc.lat,loc.lng],{icon:makeIcon(loc),zIndexOffset:500}).addTo(map);
  m.on('click',()=>selectLoc(loc.id));
  S.markers[loc.id]=m;
});
function refreshMarkers(){ALL.forEach(l=>S.markers[l.id].setIcon(makeIcon(l)));}

/* ================================================================
   REFERENCE KEY — build permanently visible list
   ================================================================ */
(function buildKey(){
  const kb=document.getElementById('key-body');
  const secs=[
    {label:'Cities',         color:TC.city,   items:CITIES},
    {label:'Rivers',         color:TC.river,  items:RIVERS},
    {label:'Regions',        color:TC.region, items:REGIONS},
    {label:'Seas & lakes',   color:TC.sea,    items:SEAS},
  ];
  secs.forEach(sec=>{
    const sec_div=document.createElement('div');
    sec_div.className='key-section';
    sec_div.innerHTML=`<div class="key-sec-hdr"><span class="key-sec-dot" style="background:${sec.color}"></span>${sec.label}</div>`;
    sec.items.forEach(loc=>{
      const row=document.createElement('div');
      row.className='key-row';
      row.id='kr-'+loc.id;
      row.innerHTML=`
        <span class="key-num" style="background:${sec.color}"></span>
        <span class="key-name">${loc.label}</span>
        <span class="key-tick" id="kt-${loc.id}"></span>`;
      row.addEventListener('click',()=>{
        map.setView([loc.lat,loc.lng],5,{animate:true});
        selectLoc(loc.id);
      });
      sec_div.appendChild(row);
    });
    kb.appendChild(sec_div);
  });
})();

function updateKeyRow(id){
  const row=document.getElementById('kr-'+id);
  const tick=document.getElementById('kt-'+id);
  if(!row||!tick) return;
  const ok=S.answered[id]===true;
  row.classList.remove('aok','awk');
  row.classList.add(ok?'aok':'awk');
  tick.textContent=ok?'✓':'✗';
}

/* ================================================================
   QUIZ LOGIC
   ================================================================ */
function selectLoc(id){
  const loc=ALL.find(l=>l.id===id);
  if(!loc) return;
  const done=S.answered[id]!==undefined;

  document.getElementById('qlbl').innerHTML=`Marker #${id} &mdash; ${TL[loc.type]}`;
  document.getElementById('qtext').className='q-text';
  document.getElementById('qtext').innerHTML=`What is the name of this location?<span class="q-badge ${TB[loc.type]}">${TL[loc.type]}</span>`;

  const fb=document.getElementById('fb');
  const ans=document.getElementById('ans');
  const hb=document.getElementById('hint-btn');

  if(done){
    const ok=S.answered[id];
    fb.textContent=ok?`✓ Correct: ${loc.label}`:`Answer: ${loc.label}`;
    fb.className=ok?'fbc':'fbw';
    ans.disabled=true; ans.value='';
    document.getElementById('chk').disabled=true;
    hb.style.display='none';
    /* scroll key row into view */
    document.getElementById('kr-'+id)?.scrollIntoView({block:'nearest'});
    return;
  }
  S.cur=id;
  fb.textContent=''; fb.className='';
  ans.disabled=false; ans.value=''; ans.focus();
  document.getElementById('chk').disabled=false;
  hb.style.display=S.hints.has(id)?'none':'inline';
  hb.textContent='Show hint'; hb.disabled=false;
  document.getElementById('kr-'+id)?.scrollIntoView({block:'nearest'});
  refreshMarkers();
}

function normalize(s){
  return s.toLowerCase()
    .replace(/[áàâäã]/g,'a').replace(/[éèêë]/g,'e').replace(/[íìîï]/g,'i')
    .replace(/[óòôöőõ]/g,'o').replace(/[úùûü]/g,'u')
    .replace(/ð/g,'d').replace(/þ/g,'th').replace(/ø/g,'o').replace(/æ/g,'ae')
    .replace(/[āēīōū]/g,c=>({ā:'a',ē:'e',ī:'i',ō:'o',ū:'u'}[c]))
    .replace(/[łśńčšž]/g,c=>({ł:'l',ś:'s',ń:'n',č:'c',š:'s',ž:'z'}[c]))
    .replace(/[^a-z0-9\s]/g,'').replace(/\s+/g,' ').trim();
}

function checkAnswer(){
  const id=S.cur;
  if(!id||S.answered[id]!==undefined) return;
  const loc=ALL.find(l=>l.id===id);
  const user=normalize(document.getElementById('ans').value);
  if(!user) return;

  const targets=[normalize(loc.label),...loc.alts.map(normalize)];
  const hit=targets.some(t=>{
    const tc=t.replace(/\(.*?\)/g,'').trim();
    const uc=user.replace(/\(.*?\)/g,'').trim();
    return t===user||tc===uc||tc.startsWith(uc)||uc.startsWith(tc);
  });

  S.answered[id]=hit;
  S.total++;
  if(hit) S.correct++;

  const fb=document.getElementById('fb');
  fb.textContent=hit?`✓ Correct! ${loc.label}`:`✗ Answer: ${loc.label}`;
  fb.className=hit?'fbc':'fbw';
  document.getElementById('ans').disabled=true;
  document.getElementById('chk').disabled=true;
  document.getElementById('hint-btn').style.display='none';

  updateScores();
  updateKeyRow(id);
  refreshMarkers();
  if(Object.keys(S.answered).length===ALL.length) setTimeout(showResult,1200);
}

function updateScores(){
  const done=Object.keys(S.answered).length;
  document.getElementById('sc').textContent=S.correct;
  document.getElementById('st').textContent=S.total;
  document.getElementById('sl').textContent=ALL.length-done;
  document.getElementById('prog').style.width=(done/ALL.length*100)+'%';
}

function showResult(){
  const pct=Math.round(S.correct/ALL.length*100);
  document.getElementById('res-score').textContent=`${S.correct} / ${ALL.length}`;
  const msgs=[
    [90,`${pct}% — exceptional command of Norse world geography.`],
    [75,`${pct}% — strong work. Review the island groups and eastern rivers.`],
    [55,`${pct}% — solid foundation. Focus on the Varangian river routes.`],
    [0, `${pct}% — keep studying. This world stretches from Vinland to Baghdad.`],
  ];
  document.getElementById('res-msg').textContent=msgs.find(m=>pct>=m[0])[1];
  document.getElementById('result').classList.add('show');
}

document.getElementById('chk').addEventListener('click',checkAnswer);
document.getElementById('ans').addEventListener('keydown',e=>{if(e.key==='Enter')checkAnswer();});
document.getElementById('hint-btn').addEventListener('click',()=>{
  const loc=ALL.find(l=>l.id===S.cur);
  if(!loc) return;
  S.hints.add(loc.id);
  document.getElementById('hint-btn').textContent=loc.hint;
  document.getElementById('hint-btn').disabled=true;
});

document.getElementById('restart').addEventListener('click',()=>{
  S={cur:null,answered:{},correct:0,total:0,hints:new Set(),markers:S.markers};
  document.getElementById('result').classList.remove('show');
  document.getElementById('qlbl').textContent='Select a marker';
  document.getElementById('qtext').textContent='Click any numbered marker on the map to begin.';
  document.getElementById('qtext').className='q-text q-idle';
  document.getElementById('fb').textContent='';
  document.getElementById('ans').disabled=true;
  document.getElementById('chk').disabled=true;
  document.getElementById('hint-btn').style.display='none';
  document.querySelectorAll('.key-row').forEach(r=>r.classList.remove('aok','awk'));
  document.querySelectorAll('.key-tick').forEach(t=>t.textContent='');
  updateScores();
  refreshMarkers();
});

updateScores();
</script>
