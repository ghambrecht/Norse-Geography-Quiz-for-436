/* ── MARKERS ── */
function mkIcon(loc){
  var done=S.answered[loc.id]!==undefined;
  var ok=S.answered[loc.id]===true;
  var bg=TC[loc.type];
  if(done) bg=ok?'#2a6048':'#8a3020';
  var sel=(!done&&S.cur===loc.id)?' sel':'';
  return L.divIcon({
    className:'',
    html:'<div class="qm'+sel+'" style="background:'+bg+'">'+loc.id+'</div>',
    iconSize:[22,22],iconAnchor:[11,11]
  });
}
ALL.forEach(function(loc){
  var m=L.marker([loc.lat,loc.lng],{icon:mkIcon(loc),zIndexOffset:500}).addTo(map);
  m.on('click',function(){pick(loc.id);});
  S.markers[loc.id]=m;
});
function refreshM(){ALL.forEach(function(l){S.markers[l.id].setIcon(mkIcon(l));});}

/* ── KEY ── */
(function(){
  var kb=document.getElementById('key-body');
  var secs=[
    {label:'Cities',color:TC.city,items:CITIES},
    {label:'Rivers',color:TC.river,items:RIVERS},
    {label:'Regions',color:TC.region,items:REGIONS},
    {label:'Seas & Lakes',color:TC.sea,items:SEAS},
  ];
  secs.forEach(function(sec){
    var sd=document.createElement('div');
    sd.className='ksec';
    sd.innerHTML='<div class="ksec-hdr"><span class="kdot" style="background:'+sec.color+'"></span>'+sec.label+'</div>';
    sec.items.forEach(function(loc){
      var row=document.createElement('div');
      row.className='krow'; row.id='kr'+loc.id;
      row.innerHTML='<span class="kdot" style="background:'+TC[loc.type||sec.type||'city']+'"></span>'
        +'<span class="kname">'+loc.label+'</span>'
        +'<span class="ktick" id="kt'+loc.id+'"></span>';
      row.onclick=function(){map.setView([loc.lat,loc.lng],5,{animate:true});pick(loc.id);};
      sd.appendChild(row);
    });
    kb.appendChild(sd);
  });
})();

function updKey(id){
  var r=document.getElementById('kr'+id);
  var t=document.getElementById('kt'+id);
  if(!r||!t) return;
  var ok=S.answered[id]===true;
  r.className='krow '+(ok?'ok':'wr');
  t.textContent=ok?'✓':'✗';
}

/* ── QUIZ ── */
function pick(id){
  var loc=ALL.filter(function(l){return l.id===id;})[0];
  if(!loc) return;
  document.getElementById('qlbl').textContent='Marker #'+id+' — '+TL[loc.type];
  var qt=document.getElementById('qtext');
  qt.className='active';
  qt.innerHTML='What is the name of this location? <span class="badge '+TB[loc.type]+'">'+TL[loc.type]+'</span>';
  var fb=document.getElementById('fb');
  var ans=document.getElementById('ans');
  var hb=document.getElementById('hintbtn');
  if(S.answered[id]!==undefined){
    var ok=S.answered[id];
    fb.textContent=(ok?'Correct: ':'Answer: ')+loc.label;
    fb.className=ok?'fbc':'fbw';
    ans.disabled=true; ans.value='';
    document.getElementById('chk').disabled=true;
    hb.style.display='none';
    var kr=document.getElementById('kr'+id);
    if(kr) kr.scrollIntoView({block:'nearest'});
    return;
  }
  S.cur=id;
  fb.textContent=''; fb.className='';
  ans.disabled=false; ans.value=''; ans.focus();
  document.getElementById('chk').disabled=false;
  hb.style.display=S.hints[id]?'none':'inline';
  hb.textContent='Show hint'; hb.disabled=false;
  var kr=document.getElementById('kr'+id);
  if(kr) kr.scrollIntoView({block:'nearest'});
  refreshM();
}

function norm(s){
  return s.toLowerCase()
    .replace(/[áàâäã]/g,'a').replace(/[éèêë]/g,'e').replace(/[íìîï]/g,'i')
    .replace(/[óòôöő]/g,'o').replace(/[úùûü]/g,'u')
    .replace(/ð/g,'d').replace(/þ/g,'th').replace(/ø/g,'o').replace(/æ/g,'ae')
    .replace(/[^a-z0-9\s]/g,'').replace(/\s+/g,' ').trim();
}

function check(){
  var id=S.cur;
  if(!id||S.answered[id]!==undefined) return;
  var loc=ALL.filter(function(l){return l.id===id;})[0];
  var user=norm(document.getElementById('ans').value);
  if(!user) return;
  var targets=[norm(loc.label)].concat(loc.alts.map(norm));
  var hit=targets.some(function(t){
    var tc=t.replace(/\(.*?\)/g,'').trim();
    var uc=user.replace(/\(.*?\)/g,'').trim();
    return t===user||tc===uc||tc.indexOf(uc)===0||uc.indexOf(tc)===0;
  });
  S.answered[id]=hit; S.total++; if(hit) S.correct++;
  var fb=document.getElementById('fb');
  fb.textContent=(hit?'Correct! ':'Wrong — answer: ')+loc.label;
  fb.className=hit?'fbc':'fbw';
  document.getElementById('ans').disabled=true;
  document.getElementById('chk').disabled=true;
  document.getElementById('hintbtn').style.display='none';
  updScores(); updKey(id); refreshM();
  if(Object.keys(S.answered).length===ALL.length) setTimeout(showResult,1200);
}

function updScores(){
  var done=Object.keys(S.answered).length;
  document.getElementById('sc').textContent=S.correct;
  document.getElementById('st').textContent=S.total;
  document.getElementById('sl').textContent=ALL.length-done;
  document.getElementById('prog').style.width=(done/ALL.length*100)+'%';
}

function showResult(){
  var pct=Math.round(S.correct/ALL.length*100);
  document.getElementById('rscore').textContent=S.correct+' / '+ALL.length;
  var msgs=[[90,pct+'% — exceptional.'],[75,pct+'% — strong work.'],[55,pct+'% — solid foundation.'],[0,pct+'% — keep studying.']];
  document.getElementById('rmsg').textContent=msgs.filter(function(m){return pct>=m[0];})[0][1];
  document.getElementById('result').classList.add('show');
}

document.getElementById('chk').addEventListener('click',check);
document.getElementById('ans').addEventListener('keydown',function(e){if(e.key==='Enter')check();});
document.getElementById('hintbtn').addEventListener('click',function(){
  var loc=ALL.filter(function(l){return l.id===S.cur;})[0];
  if(!loc) return;
  S.hints[loc.id]=true;
  document.getElementById('hintbtn').textContent=loc.hint;
  document.getElementById('hintbtn').disabled=true;
});
document.getElementById('restartbtn').addEventListener('click',function(){
  S={cur:null,answered:{},correct:0,total:0,hints:{},markers:S.markers};
  document.getElementById('result').classList.remove('show');
  document.getElementById('qlbl').textContent='Select a marker';
  var qt=document.getElementById('qtext');
  qt.className=''; qt.textContent='Click any numbered marker on the map to begin.';
  document.getElementById('fb').textContent='';
  document.getElementById('ans').disabled=true;
  document.getElementById('chk').disabled=true;
  document.getElementById('hintbtn').style.display='none';
  document.querySelectorAll('.krow').forEach(function(r){r.className='krow';});
  document.querySelectorAll('.ktick').forEach(function(t){t.textContent='';});
  updScores(); refreshM();
});

updScores();
</script>
